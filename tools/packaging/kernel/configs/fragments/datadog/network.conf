# Netkit virtual devices — used by system probe for eBPF-based network visibility
CONFIG_NETKIT=y

# vhost vsock — guest-side of the virtio socket device, needed for system probe
# communication inside the microVM
CONFIG_VHOST_VSOCK=y

# emissary dummy interface
CONFIG_DUMMY=y

# --- Network fault injection (GenSim network-fault episodes on Terrapin) ---
# Uses the same ipset + iptables MARK + tc filter/`fw` + netem pipeline as Chaos Mesh.

# Netem qdisc — delay / loss / corruption / duplication faults
CONFIG_NET_SCH_NETEM=y

# Token bucket filter — bandwidth-limit faults
CONFIG_NET_SCH_TBF=y

# PRIO qdisc with SFQ bands — placed in front of netem when a fault targets
# only specific peers, so unfiltered traffic stays on an unaffected band
CONFIG_NET_SCH_PRIO=y
CONFIG_NET_SCH_SFQ=y

# fw classifier — tc filters match the iptables fwmark set for targeted peers;
# without it "tc filter ... handle ... fw" fails and peer-scoped faults are no-ops
CONFIG_NET_CLS_FW=y
