### Base qemu override fragment for the kata-qemu runtime.
### Kept in sync with k8s-platform-machine-images
### (ansible/roles/node/templates/kata-containers/configuration.override.toml.j2);
### the node_kata_* facts are static, so this renders to a fixed file.
### enable_annotations is intentionally omitted (kpmi #2065: prevent overriding
### kata config through annotations).

[hypervisor.qemu]
kernel_params = "systemd.unified_cgroup_hierarchy=1"
# Datadog guest hooks baked into the guest image. The only hook is a no-op
# unless the pod opts in (src/tools/dd-guest-kernel-mounts/README.md).
guest_hook_path = "/usr/share/datadog/kata-guest-hooks"

[agent.kata]
debug_console_enabled = false

[runtime]
static_sandbox_resource_mgmt=true
sandbox_bind_mounts = ["/etc/datadog-agent"]
