### overhead_* must match the base config default_vcpus/default_memory.

[hypervisor.qemu]
enable_annotations = ["enable_iommu", "kernel_params", "kernel_verity_params"]
overhead_vcpus = 1.0
overhead_memory = 2048

[agent.kata]
reconnect_timeout_ms = 45000
create_container_timeout = 60

[runtime]
sandbox_cgroup_only = false
